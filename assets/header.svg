<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="240" style="background: #17151A; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17151A" />
      <stop offset="60%" stop-color="#2D2131" />
      <stop offset="100%" stop-color="#3A283F" />
    </linearGradient>

    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#927394" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#C8B8D9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#927394" stop-opacity="0.2" />
    </linearGradient>

    <style>
      @keyframes waveFlow {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
        100% { transform: translateY(0px); }
      }
      @keyframes nodeGlow {
        0% { opacity: 0.4; r: 4px; }
        50% { opacity: 0.9; r: 5.5px; }
        100% { opacity: 0.4; r: 4px; }
      }
      .anim-wave { animation: waveFlow 8s ease-in-out infinite; }
      .anim-node { animation: nodeGlow 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Dark Plum/Charcoal Header Background -->
  <rect width="1000" height="240" fill="url(#headerBg)" />
  <rect width="1000" height="240" fill="none" stroke="#46344C" stroke-width="1" rx="12" />

  <!-- Animated Speech Waveforms -->
  <g class="anim-wave">
    <path d="M 40 175 Q 120 135, 220 165 T 400 150 T 600 170 T 800 145 T 960 165" fill="none" stroke="url(#wave1Grad)" stroke-width="1.8" />
    <path d="M 20 185 Q 150 145, 300 175 T 520 160 T 740 180 T 980 155" fill="none" stroke="#927394" stroke-width="1.2" opacity="0.3" />
  </g>

  <!-- Knowledge Graph Nodes Art (Right Side) -->
  <g stroke="#927394" stroke-width="0.8" opacity="0.5">
    <line x1="740" y1="65" x2="810" y2="45" />
    <line x1="810" y1="45" x2="890" y2="80" />
    <line x1="890" y1="80" x2="830" y2="130" />
    <line x1="830" y1="130" x2="740" y2="65" />
    <line x1="890" y1="80" x2="950" y2="55" />
    <line x1="950" y1="55" x2="930" y2="125" />
    <line x1="930" y1="125" x2="830" y2="130" />
  </g>

  <circle cx="740" cy="65" r="4" fill="#C8B8D9" />
  <circle cx="810" cy="45" r="4.5" fill="#927394" class="anim-node" />
  <circle cx="890" cy="80" r="5.5" fill="#E9DDEB" class="anim-node" />
  <circle cx="830" cy="130" r="4" fill="#C8B8D9" />
  <circle cx="950" cy="55" r="3.5" fill="#927394" />
  <circle cx="930" cy="125" r="4.5" fill="#E9DDEB" />

  <!-- Accent Vertical Line -->
  <line x1="65" y1="45" x2="65" y2="195" stroke="#927394" stroke-width="1.5" opacity="0.4" />
  <circle cx="65" cy="45" r="2.5" fill="#C8B8D9" />
  <circle cx="65" cy="195" r="2.5" fill="#C8B8D9" />

  <!-- Typography -->
  <g transform="translate(90, 0)">
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#F8F4F6" letter-spacing="4">MEHER SONI</text>

    <text x="0" y="136" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#C8B8D9" letter-spacing="1.5">Artificial Intelligence · Data Science · Research</text>

    <text x="0" y="166" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="300" fill="#927394" letter-spacing="1">Speech AI · Indic NLP · Knowledge Graphs · Trustworthy AI</text>
  </g>
</svg>
