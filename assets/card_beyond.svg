<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 148" width="100%" height="148">
  <defs>
    <linearGradient id="beyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFAFF"/>
      <stop offset="100%" stop-color="#F8F4F6"/>
    </linearGradient>
    <linearGradient id="beyAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55405C" stop-opacity="0"/>
      <stop offset="30%" stop-color="#55405C"/>
      <stop offset="70%" stop-color="#BFA9C8"/>
      <stop offset="100%" stop-color="#BFA9C8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="148" fill="url(#beyBg)" rx="14"/>
  <rect width="900" height="148" fill="none" stroke="#E9DDEB" stroke-width="1.5" rx="14"/>

  <!-- Header section with subtle background -->
  <rect x="0" y="0" width="900" height="48" fill="#F3EDF7" opacity="0.5" rx="14"/>
  <rect x="0" y="44" width="900" height="4" fill="#F3EDF7"/>

  <text x="40" y="30" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#55405C" letter-spacing="1">✦ BEYOND THE LAB</text>
  <text x="456" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#BFA9C8" font-style="italic">interests &amp; distinctions</text>
  <line x1="40" y1="44" x2="860" y2="44" stroke="url(#beyAccent)" stroke-width="1.5"/>

  <!-- 4 items row -->
  <!-- Item 1: GATE -->
  <g transform="translate(40, 62)">
    <rect x="0" y="0" width="170" height="60" rx="10" fill="#FFFFFF" stroke="#E9DDEB" stroke-width="1.2"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#29242C">GATE DA 2026</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#927394">Qualified</text>
  </g>

  <!-- Item 2: Amazon -->
  <g transform="translate(222, 62)">
    <rect x="0" y="0" width="202" height="60" rx="10" fill="#FFFFFF" stroke="#E9DDEB" stroke-width="1.2"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#29242C">Amazon ML Summer School</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#927394">2026</text>
  </g>

  <!-- Item 3: Renowned Shot -->
  <g transform="translate(436, 62)">
    <rect x="0" y="0" width="290" height="60" rx="10" fill="#FFFFFF" stroke="#BFA9C8" stroke-width="1.5"/>
    <rect x="0" y="0" width="290" height="3" fill="#55405C" opacity="0.4" rx="2"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#29242C">Renowned Shot</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#6F6670">68th National Shooting Championship · 10M Pistol</text>
  </g>

  <!-- Item 4: Skier -->
  <g transform="translate(738, 62)">
    <rect x="0" y="0" width="122" height="60" rx="10" fill="#FFFFFF" stroke="#E9DDEB" stroke-width="1.2"/>
    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#29242C">Certified Skier</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#927394">IISM Gulmarg</text>
  </g>
</svg>
