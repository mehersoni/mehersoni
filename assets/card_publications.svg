<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 248" width="100%" height="248">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF7FC"/>
    </linearGradient>
    <linearGradient id="topRule" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#55405C" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#55405C"/>
      <stop offset="75%"  stop-color="#927394"/>
      <stop offset="100%" stop-color="#927394" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="248" fill="url(#bg)" rx="16"/>
  <rect width="900" height="248" fill="none" stroke="#EBE0EE" stroke-width="1.5" rx="16"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#topRule)" rx="2" opacity="0.55"/>

  <!-- Section label -->
  <text x="40" y="36"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="10" font-weight="700" letter-spacing="3" fill="#BFA9C8">PUBLICATIONS &amp; RESEARCH</text>
  <line x1="40" y1="46" x2="860" y2="46" stroke="#EBE0EE" stroke-width="1"/>

  <!-- ─── PUBLICATION 1 ─── -->
  <!-- Plum left bar -->
  <rect x="40" y="58" width="4" height="54" fill="#55405C" rx="2"/>

  <!-- Venue + author badges -->
  <rect x="54" y="58" width="106" height="22" rx="11" fill="#F3EDF7" stroke="#BFA9C8" stroke-width="1"/>
  <text x="107" y="73" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#55405C" text-anchor="middle">Springer IDBA 2026</text>

  <rect x="168" y="58" width="84" height="22" rx="11" fill="#EDE3F2" stroke="#BFA9C8" stroke-width="1"/>
  <text x="210" y="73" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#55405C" text-anchor="middle">First Author</text>

  <!-- Title -->
  <text x="54" y="96"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14" font-weight="700" fill="#29242C">Reducing Hallucinated Legal Citations in LLM Responses for Indian Law</text>

  <!-- Metric line -->
  <text x="54" y="114"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="11" fill="#6F6670">82% reduction in false citations (CHR: 0.343 → 0.063) · 0.925 Retrieval Reliability Score</text>

  <line x1="40" y1="128" x2="860" y2="128" stroke="#F3EDF7" stroke-width="1"/>

  <!-- ─── PUBLICATION 2 ─── -->
  <rect x="40" y="138" width="4" height="54" fill="#927394" rx="2"/>

  <rect x="54" y="138" width="114" height="22" rx="11" fill="#F3EDF7" stroke="#BFA9C8" stroke-width="1"/>
  <text x="111" y="153" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#55405C" text-anchor="middle">HACER 2025 · IIIT Vadodara</text>

  <rect x="176" y="138" width="84" height="22" rx="11" fill="#EDE3F2" stroke="#BFA9C8" stroke-width="1"/>
  <text x="218" y="153" font-family="'Segoe UI', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#55405C" text-anchor="middle">First Author</text>

  <text x="54" y="176"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="14" font-weight="700" fill="#29242C">Knowledge Graph Construction from Review-Based Conversational Data</text>

  <text x="54" y="194"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="11" fill="#6F6670">Neo4j pipeline · entity-relation extraction · inverse multi-hop traversal</text>

  <line x1="40" y1="208" x2="860" y2="208" stroke="#F3EDF7" stroke-width="1"/>

  <!-- ─── PUBLICATION 3 (co-author, lighter treatment) ─── -->
  <rect x="40" y="216" width="4" height="26" fill="#E9DDEB" rx="2"/>

  <text x="54" y="233"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="13" font-weight="500" fill="#6F6670">Explainable Drug Adoption Forecasting using Knowledge Graphs</text>

  <text x="610" y="233"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="10" fill="#BFA9C8">Springer IDBA 2026 · Co-Author</text>
</svg>
