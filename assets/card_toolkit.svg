<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 186" width="100%" height="186">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF7FC"/>
    </linearGradient>
  </defs>

  <rect width="900" height="186" fill="url(#bg)" rx="16"/>
  <rect width="900" height="186" fill="none" stroke="#EBE0EE" stroke-width="1.5" rx="16"/>

  <text x="40" y="36"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="10" font-weight="700" letter-spacing="3" fill="#BFA9C8">TECHNICAL TOOLKIT</text>
  <line x1="40" y1="46" x2="860" y2="46" stroke="#EBE0EE" stroke-width="1"/>

  <!-- ─── Two-column layout ─── -->

  <!-- Left column: Speech & NLP + Knowledge -->
  <!-- Row 1 -->
  <rect x="40" y="56" width="5" height="30" fill="#55405C" rx="2.5" opacity="0.75"/>
  <text x="56" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#29242C">Speech &amp; Indic NLP</text>
  <text x="56" y="86" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6F6670">Speech Processing · Indic G2P · ASR · TTS · Phoneme Inventories · CLS · Multi-Script</text>

  <line x1="40" y1="98" x2="430" y2="98" stroke="#F5F0F6" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="40" y="106" width="5" height="30" fill="#927394" rx="2.5" opacity="0.75"/>
  <text x="56" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#29242C">Knowledge &amp; Reasoning</text>
  <text x="56" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6F6670">Neo4j · Cypher · Py2Neo · GraphSAGE · GraphRAG · Entity-Relation Extraction</text>

  <!-- Vertical separator -->
  <line x1="455" y1="52" x2="455" y2="168" stroke="#EBE0EE" stroke-width="1"/>

  <!-- Right column: ML/DL + Edge -->
  <!-- Row 1 -->
  <rect x="472" y="56" width="5" height="30" fill="#BFA9C8" rx="2.5" opacity="0.9"/>
  <text x="488" y="70" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#29242C">Machine Learning &amp; Deep Learning</text>
  <text x="488" y="86" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6F6670">Python · PyTorch · TensorFlow · Scikit-learn · XGBoost · CNN-LSTM · Wav2Vec 2.0</text>

  <line x1="472" y1="98" x2="860" y2="98" stroke="#F5F0F6" stroke-width="1"/>

  <!-- Row 2 -->
  <rect x="472" y="106" width="5" height="30" fill="#E9DDEB" rx="2.5"/>
  <text x="488" y="120" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#29242C">Edge, Embedded &amp; Tools</text>
  <text x="488" y="136" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6F6670">Arduino · ESP-LilyGo · C · Streamlit · Pandas · NumPy · Git · Linux · LaTeX</text>

  <!-- Bottom divider -->
  <line x1="40" y1="156" x2="860" y2="156" stroke="#F3EDF7" stroke-width="1"/>
  <text x="40" y="174"
    font-family="'Segoe UI', system-ui, sans-serif"
    font-size="10.5" fill="#BFA9C8" font-style="italic">Specialised in multilingual speech systems, graph databases and trustworthy ML.</text>
</svg>
