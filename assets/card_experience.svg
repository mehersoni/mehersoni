  <line x1="40" y1="48" x2="860" y2="48" stroke="#2D2733" stroke-width="1" />

  <!-- Connected Roadmap Path -->
  <path d="M 80 135 L 250 165 L 420 115 L 590 165 L 760 120" fill="none" stroke="url(#pathGrad)" stroke-width="2.5" opacity="0.8" stroke-dasharray="4 2" />

  <!-- Node 1: IIT Ropar -->
  <g transform="translate(80, 135)">
