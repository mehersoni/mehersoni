    <text x="0" y="-24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#F8F6F2" text-anchor="middle">IIT Ropar</text>
