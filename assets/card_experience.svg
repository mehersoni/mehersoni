<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" style="background: #17151A; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="expGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1A23" />
      <stop offset="100%" stop-color="#141217" />
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78B9B" />
      <stop offset="50%" stop-color="#C8B8D9" />
      <stop offset="100%" stop-color="#E8D6DC" />
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="url(#expGrad)" rx="12" />
  <rect width="900" height="240" fill="none" stroke="#2D2733" stroke-width="1.5" rx="12" />

