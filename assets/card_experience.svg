    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif" font-size="10" fill="#C8B8D9" text-anchor="middle">Speech &amp; Indic G2P</text>
