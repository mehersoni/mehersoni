<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230" style="background: #FFFFFF; border-radius: 12px; overflow: hidden;">
  <rect width="900" height="230" fill="#FFFFFF" rx="12" />
  <rect width="900" height="230" fill="none" stroke="#E9DDEB" stroke-width="1.5" rx="12" />

