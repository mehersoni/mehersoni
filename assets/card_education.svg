<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="100%" height="185" style="background: #FFFFFF; border-radius: 12px; overflow: hidden;">
  <defs>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#55405C" flood-opacity="0.05" />
    </filter>
  </defs>

  <rect width="900" height="185" fill="#FFFFFF" rx="12" filter="url(#cardShadow)" />
  <rect width="900" height="185" fill="none" stroke="#E9DDEB" stroke-width="1.5" rx="12" />

  <!-- Section Header -->
  <text x="36" y="36" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#927394" letter-spacing="2">EDUCATION</text>
  <line x1="36" y1="46" x2="864" y2="46" stroke="#F1E8F2" stroke-width="1" />

  <!-- BIT Mesra -->
  <g transform="translate(36, 62)">
    <circle cx="22" cy="26" r="18" fill="#F8F4F6" stroke="#E9DDEB" stroke-width="1" />
    <path d="M 13 24 L 22 19 L 31 24 L 22 29 Z M 31 24 V 29 M 18 27 V 31 C 18 33 26 33 26 31 V 27" fill="none" stroke="#55405C" stroke-width="1.3" stroke-linecap="round" />

    <text x="52" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#29242C">Birla Institute of Technology, Mesra</text>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#6F6670">B.Tech in Artificial Intelligence · 2023–2027</text>
    
    <rect x="52" y="52" width="124" height="24" rx="6" fill="#F8F4F6" stroke="#BFA9C8" stroke-width="1" />
    <text x="114" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#55405C" text-anchor="middle">SGPA 9.62 / 10</text>
  </g>

  <line x1="450" y1="62" x2="450" y2="160" stroke="#F1E8F2" stroke-width="1" />

  <!-- IIT Madras -->
  <g transform="translate(486, 62)">
    <circle cx="22" cy="26" r="18" fill="#F8F4F6" stroke="#E9DDEB" stroke-width="1" />
    <path d="M 13 24 L 22 19 L 31 24 L 22 29 Z M 31 24 V 29 M 18 27 V 31 C 18 33 26 33 26 31 V 27" fill="none" stroke="#55405C" stroke-width="1.3" stroke-linecap="round" />

    <text x="52" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="16" font-weight="700" fill="#29242C">Indian Institute of Technology Madras</text>
    <text x="52" y="42" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" fill="#6F6670">B.S. in Data Science · 2024–2028</text>
    
    <rect x="52" y="52" width="140" height="24" rx="6" fill="#F8F4F6" stroke="#BFA9C8" stroke-width="1" />
    <text x="122" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#55405C" text-anchor="middle">Dual-Degree Program</text>
  </g>
